services:
  - type: web
    name: proptech-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt && python seed.py
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_HMAC_SECRET
        generateValue: true
      # Login users, set in the Render dashboard (never committed):
      # "usuario:contraseña:rol;otro:clave:rol" with rol = comercial | proyectos | admin
      - key: AUTH_USERS
        sync: false

  # The frontend is a static Next.js export hosted on Vercel (see vercel.json).
